name: Backend CI

on:
  push:
    branches: [main, ai-tdd]
    paths:
      - "services/backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "services/backend/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

# Cancel superseded runs of the same branch / PR.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    working-directory: services/backend

env:
  PYTHON_VERSION: "3.11"

jobs:
  lint:
    name: Lint (ruff + black)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml

      - name: Install lint tools
        run: pip install ruff black

      - name: ruff check
        run: ruff check --output-format=github .

      # Run black even when ruff failed, so both reports land in one run.
      - name: black --check
        if: ${{ !cancelled() }}
        run: black --check --diff --color .

  test:
    name: Tests + coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      JWT_SECRET_KEY: ci-test-secret-not-for-production
      DATABASE_URL: sqlite:///./test_todo.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run migrations (smoke test on a fresh SQLite DB)
        run: alembic upgrade head

      - name: Run tests with coverage
        run: |
          pytest -v --tb=short \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-report=html \
            --cov-fail-under=80 \
            --junitxml=pytest-report.xml

      - name: Coverage summary
        if: ${{ !cancelled() }}
        run: |
          {
            echo "## Backend coverage"
            echo
            coverage report --format=markdown
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: |
            services/backend/coverage.xml
            services/backend/htmlcov/
            services/backend/pytest-report.xml
          retention-days: 7
          if-no-files-found: ignore

  mutation:
    name: Mutation tests (mutmut)
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 60
    env:
      JWT_SECRET_KEY: ci-test-secret-not-for-production
      DATABASE_URL: sqlite:///./test_todo.db
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: services/backend/pyproject.toml

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: mutmut run
        run: mutmut run

      - name: mutmut results
        if: ${{ !cancelled() }}
        run: mutmut results
